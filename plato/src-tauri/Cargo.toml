[package]
name = "plato"
version = "0.1.0"
description = "Local Writer's IDE"
authors = ["Plato Development"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-shell = "2.0.0"
tauri-plugin-opener = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13", features = ["stream"] }
tokio = { version = "1.0", features = ["full"] }
futures-util = "0.3"
# The 'sampler' feature enables stateful penalty tracking and nucleus sampling.
# GPU features (e.g., 'vulkan') are intentionally omitted to comply with the 
# strict CPU/RAM-only execution constraint of the target production environment.
llama-cpp-2 = { version = "0.1.141", features = ["sampler"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
